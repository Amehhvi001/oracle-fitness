function Qs(){const g=S.goal,t=S.t,a=[['water','Hydrate',t.water>=g.water,t.water+'/'+g.water],['workout','Train',tm()>=g.wm,tm()+'/'+g.wm+' min'],['food','Log food',t.foods.length>0,t.foods.length+' items'],['mood','Log mood',t.mood!==null,''],['sleep','Sleep',t.sleep>=g.sleep,t.sleep+'/'+g.sleep+' h']];

function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2000)}
function gain(xp,g,h){S.xp+=xp;S.gold+=g;S.hp=Math.min(100,S.hp+h);while(S.xp>=S.lvl*100){S.xp-=S.lvl*100;S.lvl++;toast('Level up! Level '+S.lvl)}}
function award(){Qs().forEach(q=>{if(q[2]&&!S.t.paid[q[0]]){S.t.paid[q[0]]=1;gain(15,5,4);toast('Done: '+q[1]+' +15 XP')}})}
function roll(){const d=dk();if(S.t.day===d)return;const q=Qs(),n=q.filter(x=>x[2]).length;
S.hist[S.t.day]={c:net(),w:S.t.water,m:tm(),md:S.t.mood,s:S.t.sleep,q:n,n:q.length,me:S.t.me,ml:S.t.ml,mt:S.t.mt,mr:S.t.mr,km:dist()};
const miss=q.length-n;S.hp=Math.max(0,S.hp-miss*8);
if(S.hp===0){S.lvl=Math.max(1,S.lvl-1);S.hp=50;S.xp=0;setTimeout(()=>toast('You fainted. Lost a level, HP restored'),600)}
else if(miss)setTimeout(()=>toast('Missed '+miss+' quests yesterday'),600);
S.t=fresh(d)}
function streak(){const q=Qs();let c=q.filter(x=>x[2]).length/q.length>=.8?1:0;for(let i=1;i<400;i++){const h=S.hist[dk(-i)];if(!h||h.q/h.n<.8)break;c++}return c}
const commit=()=>{award();save();render()};
const R=[88,66,44];
function rings(p,cols){return '<svg viewBox="0 0 200 200" class="rings">'+R.map((r,i)=>{const C=2*Math.PI*r;return `<circle cx="100" cy="100" r="${r}" fill="none" stroke-width="18" style="stroke:${cols[i]};stroke-opacity:.22"/><circle class="rg" data-c="${C}" data-p="${Math.min(1,p[i])}" cx="100" cy="100" r="${r}" fill="none" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 100 100)" style="stroke:${cols[i]};transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/>`}).join('')+'</svg>'}
const lbl=k=>new Date(k+'T12:00').toLocaleDateString('en',{weekday:'narrow'});
function week(){const a=[];for(let i=6;i>=0;i--){const k=dk(-i);a.push({k,h:i?(S.hist[k]||{}):{c:net(),w:S.t.water,m:tm(),md:S.t.mood,s:S.t.sleep,km:dist()}})}return a}
function bars(f,col,goal){const w=week(),v=w.map(x=>f(x.h)||0),mx=Math.max(goal||1,...v,1);
let s='<svg viewBox="0 0 280 120" width="100%">';
v.forEach((n,i)=>{const h=n/mx*80;s+=`<rect x="${i*40+6}" y="${90-h}" width="28" height="${Math.max(h,3)}" rx="8" style="fill:${col};opacity:${i==6?1:.55}"/><text x="${i*40+20}" y="110" text-anchor="middle" font-size="11" style="fill:var(--sub)">${lbl(w[i].k)}</text>`});
if(goal)s+=`<line x1="0" x2="280" y1="${90-goal/mx*80}" y2="${90-goal/mx*80}" stroke-dasharray="3 4" style="stroke:var(--sub)"/>`;
return s+'</svg>'}
function wline(){const a=S.wt.slice(-14);if(a.length<2)return '<p class="sub">Log two weigh-ins to see your line.</p>';
const ws=a.map(x=>x.w),lo=Math.min(...ws),r=(Math.max(...ws)-lo)||1,p=a.map((x,i)=>[10+i*260/(a.length-1),85-(x.w-lo)/r*65]);
return `<svg viewBox="0 0 280 100" width="100%"><polyline points="${p.map(q=>q.join(',')).join(' ')}" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--blue)"/>${p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" style="fill:var(--blue)"/>`).join('')}</svg>`}
const card=(t,b)=>`<div class="card">${t?`<h3>${t}</h3>`:''}${b}</div>`;

<div class="grow st"><small>Train</small><div style="color:var(--red)">${tm()}<u> /${g.wm} min</u></div><small>Fuel</small><div style="color:${fc}">${n}<u> /${g.cal} kcal</u></div><small>Hydrate</small><div style="color:var(--blue)">${S.t.water}<u> /${g.water} glasses</u></div></div></div>

${card('Your hero',`<div class="row"><div style="font-size:48px">${av}</div><div class="grow"><b>Level ${S.lvl}</b><div class="pb"><i style="width:${S.hp}%;background:var(--red)"></i></div><small class="sub">Health ${S.hp}/100</small><div class="pb"><i style="width:${S.xp/(S.lvl*100)*100}%;background:var(--org)"></i></div><small class="sub">XP ${S.xp}/${S.lvl*100}</small></div></div>`)}`}

${card('Add or reduce',(S.fav.length?`<div class="chips">${S.fav.map((f,i)=>`<button onclick="fav(${i})">${esc(f.n)} · ${f.k}</button>`).join('')}</div>`:'')+`<input id="fn" placeholder="What was it? (optional)"><input id="fk" type="number" inputmode="numeric" placeholder="Calories"><div class="row"><button class="btn grn grow" onclick="addF(1)">＋ Add</button><button class="btn red grow" onclick="addF(-1)">− Reduce</button></div>`)}

function vTrain(){const wk=week().reduce((a,x)=>a+(x.h.m||0),0);

${card('Log a workout',`<div class="chips">${['Run','Gym','Walk','Yoga','Sport','Cycling'].map(c=>`<button onclick="$('#wn').value='${c}'">${c}</button>`).join('')}</div><input id="wn" placeholder="Workout name"><div class="g2"><input id="wm" type="number" inputmode="numeric" placeholder="Minutes"><input id="wb" type="number" inputmode="numeric" placeholder="kcal burned"></div><button class="btn red" style="width:100%" onclick="addW()">Log workout</button>`)}
${card('Today',S.t.workouts.length?S.t.workouts.map((w,i)=>`<div class="item"><span>${esc(w.n)} · ${w.m} min${w.b?' · −'+w.b+' kcal':''}</span><button class="x" onclick="delW(${i})">×</button></div>`).join(''):'<p class="sub">No workouts yet.</p>')}`}
function vTrends(){const g=S.goal,l=S.wt[S.wt.length-1];
return `<h1>Trends</h1><p class="sub">Last 7 days. Dashed line is your goal.</p>

${card('Weight'+(l?' · latest '+l.w:''),`<div class="row"><input id="wv" type="number" inputmode="decimal" placeholder="Today’s weight" style="margin:0"><button class="btn" onclick="addWt()">Save</button></div>${wline()}`)}`}

return `<h1>You</h1>${card('Appearance',`<div class="chips">${['dark','light','auto'].map(t=>`<button class="${S.theme===t?'on':''}" onclick="th('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`)}
${card('Goals',`<div class="g2">${gi('cal','Calories (estimate)')}${gi('water','Water glasses')}${gi('sleep','Sleep hours')}${gi('wm','Training minutes')}</div>`)}
${card('Your own quests',S.hab.map(h=>`<div class="item"><span>${esc(h.n)}</span><button class="x" onclick="delH(${h.id})">×</button></div>`).join('')+`<div class="row" style="margin-top:8px"><input id="hn" placeholder="Study, read, pray…" style="margin:0"><button class="btn" onclick="addH()">Add</button></div>`)}
${card('Feedback',`<div class='chips'><button class='${S.snd!==false?'on':''}' onclick='setSnd(true)'>Sound on</button><button class='${S.snd===false?'on':''}' onclick='setSnd(false)'>Sound off</button></div>`)}
${card('Backup',`<p class="sub">Your data lives in Safari on this phone. Copy a backup and keep it in Notes.</p><textarea id="bk" rows="3" placeholder="Paste a backup here to restore"></textarea><div class="row"><button class="btn grow" onclick="copyB()">Copy backup</button><button class="btn alt grow" style="width:auto" onclick="restore()">Restore</button></div>`)}`}
function wat(d){S.t.wh=S.t.wh||[];if(d>0)S.t.wh.push(new Date().getHours());else if(S.t.water>0)S.t.wh.pop();S.t.water=Math.max(0,S.t.water+d);if(d>0)gain(1,0,0);commit()}
function addF(s){const nm=$('#fn').value.trim(),k=parseInt($('#fk').value,10);if(!k||k<0)return toast('Enter calories');
const n=nm||(s>0?'Food':'Reduced');S.t.foods.push({n,k:s*k,h:new Date().getHours()});
if(s>0&&nm&&!S.fav.some(f=>f.n===n&&f.k===k))S.fav=[{n,k},...S.fav].slice(0,8);gain(2,0,0);commit()}
function fav(i){const f=S.fav[i];S.t.foods.push({n:f.n,k:f.k,h:new Date().getHours()});gain(2,0,0);commit()}
function delF(i){S.t.foods.splice(i,1);commit()}
function addW(){const n=$('#wn').value.trim()||'Workout',m=parseInt($('#wm').value,10),b=parseInt($('#wb').value,10)||0;if(!m||m<1)return toast('Enter minutes');
S.t.workouts.push({n,m,b});gain(Math.min(40,Math.round(m/2)),Math.round(m/10),2);commit()}
function delW(i){S.t.workouts.splice(i,1);commit()}
function md(i){S.t.mood=i;commit()}
function sl(d){S.t.sleep=Math.max(0,Math.min(14,S.t.sleep+d));commit()}

function addH(){const n=$('#hn').value.trim();if(!n)return;S.hab.push({id:Date.now(),n});commit()}

else if(s==4){if(!OB.goal)return toast('Pick your aim');S.prof={sex:OB.sex,age:OB.age,ht:OB.ht,wt:OB.wt,goal:OB.goal}}
OB.st++;obDraw()}
function obDone(u){S.ob=1;if(OB.name)S.name=OB.name;if(u)Object.assign(S.goal,calcT());save();closeM();render();toast(u?'Goals set':'Setup saved')}
function itemCards0(){const g=S.goal,n=Math.max(0,net()),w=S.t.water,pb=(p,c)=>`<div class='pb'><i style='width:${Math.min(100,p*100)}%;background:${c}'></i></div>`,fc=n>g.cal?'var(--org)':'var(--grn)';

function moodBig(){const L=S.t.mlog||[],m=S.t.mood;if(m==null)return `<div class='card ic2' style='--c:var(--org)'><h3>Mood</h3><p class='sub' style='margin:8px 0 12px'>Check in any time you want. Add the reason and your weekly summary learns what lifts you.</p><button class='btn' style='width:100%' onclick='openM()'>Check in</button></div>`;
const c=L.length||1;return `<div class='card ic2' style='--c:var(--org)'><div class='row' style='justify-content:space-between'><h3>Mood</h3><b>${c} check-in${c==1?'':'s'} today</b></div><div class='row' style='margin-top:12px'><div class='mini' style='--h:${mh(m)}'></div><div class='grow'><b style='font-size:20px'>${esc(S.t.ml||ml(m))}</b><div class='sub' style='margin:0'>${esc((S.t.mt||[]).join(', ')||'No reason added')}</div></div></div><div class='row' style='margin-top:14px'><button class='btn grow' onclick='openM()'>Check in again</button><button class='btn alt' style='width:auto;padding:13px 16px' onclick='go("Mood")'>History</button></div></div>`}
function openM(){MM={x:.5,y:.5,tags:[],note:'',st:1};mDraw()}
function mSave(){const f=fe(MM.x,MM.y),L=S.t.mlog=S.t.mlog||[];if(!L.length&&S.t.mood!=null)L.push({x:S.t.mood/100,y:(S.t.me==null?50:S.t.me)/100,l:S.t.ml||ml(S.t.mood),tg:S.t.mt||[],n:S.t.mr||'',h:null});
L.push({x:MM.x,y:MM.y,l:f[0],tg:MM.tags.slice(),n:($('#mn').value||'').trim().slice(0,500),h:new Date().getHours(),mi:new Date().getMinutes()});const av=k=>L.reduce((a,e)=>a+e[k],0)/L.length;
S.t.mood=Math.round(av('x')*100);S.t.me=Math.round(av('y')*100);S.t.ml=f[0];S.t.mt=[...new Set(L.flatMap(e=>e.tg))];S.t.mr=L[L.length-1].n;commit();MM.st=3;mDraw()}
function todayLog(){const L=S.t.mlog||[];return L.length?card('Today’s check-ins',L.slice().reverse().map(e=>`<div class='item' style='display:block'><div class='row' style='justify-content:space-between'><b>${esc(e.l)}</b><span class='sub' style='margin:0'>${e.h==null?'':String(e.h).padStart(2,'0')+':'+String(e.mi||0).padStart(2,'0')}</span></div>${e.tg.length?`<div class='sub' style='margin:2px 0'>${esc(e.tg.join(' · '))}</div>`:''}${e.n?`<div style='margin-top:4px'>${esc(e.n)}</div>`:''}</div>`).join('')):''}
const mr=(p,c)=>{const C=2*Math.PI*22;return `<svg viewBox='0 0 56 56' width='52' height='52' style='flex:none'><circle cx='28' cy='28' r='22' fill='none' stroke-width='6' style='stroke:${c};stroke-opacity:.25'/><circle cx='28' cy='28' r='22' fill='none' stroke-width='6' stroke-linecap='round' stroke-dasharray='${C}' stroke-dashoffset='${C*(1-Math.max(0,Math.min(1,p)))}' transform='rotate(-90 28 28)' style='stroke:${c}'/></svg>`};
const tile=(c,num,sm,unit,lab,sub,p,btns)=>`<div class='tl' style='--c:${c}'><div class='row' style='justify-content:space-between;align-items:flex-start'><div style='min-width:0'><div class='tn${sm?' s':''}'>${num}</div><div class='tu'>${unit}</div></div>${mr(p,c)}</div><div><div class='tlab'>${lab}</div><div class='tsub'>${sub}</div></div><div class='row' style='gap:6px'>${btns}</div></div>`;
function itemCards1(){const g=S.goal,n=Math.max(0,net()),w=S.t.water,m=S.t.mood,t=tm(),fc=n>g.cal?'var(--org)':'var(--grn)',b=(f,x,c)=>`<button class='btn ${c||''}' onclick='${f}'>${x}</button>`,L=(S.t.mlog||[]).length||(m==null?0:1);
return `<div class='tg2'>${tile('var(--red)',t,0,'min','Training','Goal '+g.wm+' min',t/g.wm,b('runOpen()','Run','grow')+b('go("Train")','Log','alt'))}${tile('var(--blue)',w,0,'glasses','Water','Goal '+g.water+' glasses',w/g.water,b('wat(-1)','\u2212','alt')+b('wat(1)','+ Glass','grow'))}${tile(fc,'~'+n,0,'kcal','Food','Goal '+g.cal+' kcal',n/g.cal,b('go("Food")','Log food','grow'))}${m==null?tile('var(--org)','\u2013',0,'','Mood','Not logged yet',0,b('openM()','Check in','grow')):tile('var(--org)',esc(S.t.ml||ml(m)),1,'','Mood',L+' check-in'+(L==1?'':'s')+' today',m/100,b('openM()','Check in','grow')+b('go("Mood")','History','alt'))}</div>`}
function itemCards(){const g=S.goal,n=Math.max(0,net()),w=S.t.water,m=S.t.mood,t=tm(),fc=n>g.cal?'var(--org)':'var(--grn)',wk=S.t.workouts,lw=wk[wk.length-1],wa=Array(24).fill(0),fa=Array(24).fill(0),L=(S.t.mlog||[]).length||(m==null?0:1);
(S.t.wh||[]).forEach(h=>wa[h]++);S.t.foods.forEach(f=>{if(f.h!=null&&f.k>0)fa[f.h]+=f.k});
const cb=(f,x,l)=>`<button class='cv' onclick='${f}' aria-label='${l}'>${x}</button>`,at=(c,ti,btn,body)=>`<div class='at' style='--c:${c}'><div class='hh'><h4>${ti}</h4><div class='row' style='gap:6px;flex:none'>${btn}</div></div>${body}</div>`;
return `<div class='tg2'>`+at('var(--blue)','Water',cb('wat(-1)','−','Remove a glass')+cb('wat(1)','+','Add a glass'),`<div class='tdy'>Today</div><div class='bn'>${w}<small>glasses</small></div>${hrs(wa,'var(--blue)')}`)
+at(fc,'Food',cb('go("Food")','›','Open food'),`<div class='tdy'>Estimated today</div><div class='bn'>~${n}<small>kcal</small></div>${hrs(fa,fc)}`)
+at('var(--red)','Training',cb('go("Train")','›','Open training'),`<div class='tdy'>${lw?esc(lw.n):'Today'}</div><div class='bn'>${t}<small>min</small></div><button class='pill' onclick='runOpen()'>Start a run</button>`)
+at('var(--org)','Mood',cb('openM()','+','Check in'),`<div class='tdy'>${L} check-in${L==1?'':'s'} today</div><div class='bn' style='font-size:26px;padding:5px 0'>${m==null?'Not logged':esc(S.t.ml||ml(m))}</div><button class='pill' onclick='go("Mood")'>History</button>`)+`</div>`}
function vToday(){const h=vToday0(),tc=topCards(),i=h.indexOf(tc),b='<div class="card"><h3 style="color:var(--ink);font-size:18px;font-weight:700">Activity</h3>',j=h.indexOf(b),k=h.indexOf('<div class="gr">');if(i<0||j<i||k<j)return h;const g=tc.indexOf("<div class='card'>"),r=h.slice(0,j)+h.slice(k),Q=Qs(),p=Math.round(Q.filter(x=>x[2]).length/Q.length*100),a=h.slice(j,k).replace(/<div class="row" style="margin-top:14px">.*$/s,'</div>').replace('</svg></div>','</svg><div class="mid"><b style="font-size:26px">'+p+'%</b><span>quests done</span></div></div>'),w=tc.indexOf("<div class='card'>",g+1);return (r.slice(0,i)+tc.slice(0,g)+a+itemCards()+r.slice(i+tc.length)).replace(/<div class="q"[^>]*><div class="ck[^"]*">[^<]*<[/]div><span>(?:Hydrate|Train|Log food)<[/]span><small>[^<]*<[/]small><[/]div>/g,'')}
function vTodayOld(){let h=vToday0();const a="<div class='card'><div class='row' style='justify-content:space-between;align-items:flex-end'>",b='<div class="card"><h3 style="color:var(--ink);font-size:18px;font-weight:700">Activity</h3>';
const goal=calcT()?'':`<div class='card'><h3 style='color:var(--ink);font-size:18px;font-weight:700'>Goals that fit your body</h3><p class='sub' style='margin:0 0 12px'>Targets differ by sex, age, size and aim. Answer four quick questions.</p><button class='btn' style='width:100%' onclick='go("You")'>Set my goals</button></div>`;
let i=h.indexOf(a);h=i<0?moodBig()+h:h.slice(0,i)+moodBig()+goal+h.slice(i);i=h.indexOf(b);return i<0?h:h.slice(0,i)+wpeek()+h.slice(i)}
function cap(f,g,u){const w=wd(),n=w.filter(x=>x.h.m>0||x.h.w>0||x.h.c>0||x.h.s>0).length||1,d=w.filter(x=>(f(x.h)||0)>=g).length;return `<p class='sub' style='margin:0 0 6px;font-size:13px'>Goal reached on ${d} of ${n} days. Each bar is one day, the last bar is today.</p>`}
function vTrends(){const g=S.goal,l=S.wt[S.wt.length-1],o=S.showCh;
const C=[['Calories (estimate)',h=>h.c>0?h.c:0,'var(--grn)',g.cal],['Water',h=>h.w,'var(--blue)',g.water],['Training minutes',h=>h.m,'var(--red)',g.wm],['Sleep hours',h=>h.s,'var(--org)',g.sleep]];
return `<div class='hd'><span></span><b>Trends</b><span></span></div>${wsum()}${moodJ()}<button class='ed' onclick='S.showCh=!S.showCh;save();render()'>${o?'Hide charts':'See the charts'}</button>
${o?C.map(c=>card(c[0],cap(c[1],c[3])+bars(c[1],c[2],c[3]))).join(''):''}
${card('Weight'+(l?' · latest '+l.w:''),`<div class="row"><input id="wv" type="number" inputmode="decimal" placeholder="Today’s weight" style="margin:0"><button class="btn" onclick="addWt()">Save</button></div>${wline()}`)}`}
function calcT(){const p=S.prof;if(!p||!p.sex||!p.age||!p.ht||!p.wt||!p.goal)return null;
const bmr=10*p.wt+6.25*p.ht-5*p.age+(p.sex=='m'?5:p.sex=='f'?-161:-78),adj={lose:-400,fit:0,gain:300}[p.goal],fl={m:1600,f:1400,x:1500}[p.sex];
return{cal:Math.round(Math.max(fl,bmr*1.4+adj)/50)*50,water:Math.max(6,Math.min(14,Math.round(p.wt*.033/.25))),sleep:p.age<18?9:p.age<=25?8:7,wm:{lose:40,fit:30,gain:45}[p.goal]}}
function pf(k,v){S.prof=S.prof||{};if(['age','ht','wt'].includes(k)){v=parseFloat(v);if(!(v>0))v=''}S.prof[k]=v;save();render()}
function applyT(){const t=calcT();if(!t)return;Object.assign(S.goal,t);save();render();toast('Goals updated')}
function profCard(){const p=S.prof||{},t=calcT(),ch=(k,A)=>`<div class='chips'>${A.map(a=>`<button class='${p[k]===a[0]?'on':''}' onclick='pf("${k}","${a[0]}")'>${a[1]}</button>`).join('')}</div>`,ip=(k,ph)=>`<input type='number' inputmode='decimal' placeholder='${ph}' value='${p[k]||''}' onchange='pf("${k}",this.value)' style='margin:0'>`;
return card('Body and goals',`<p class='sub' style='font-size:13px;margin:0 0 8px'>Bodies differ, so targets should too. Fill this in and the app suggests goals that fit you.</p>${ch('sex',[['m','Male'],['f','Female'],['x','Prefer not to say']])}<div class='g2' style='grid-template-columns:1fr 1fr 1fr'>${ip('age','Age')}${ip('ht','Height cm')}${ip('wt','Weight kg')}</div><div class='sub' style='margin:10px 0 6px'>Your aim</div>${ch('goal',[['lose','Lose fat'],['fit','Stay fit'],['gain','Build muscle']])}${t?`<p style='margin:6px 0 10px'>Suggested: about <b>${t.cal} kcal</b>, <b>${t.water} glasses</b> of water, <b>${t.sleep} hours</b> sleep, <b>${t.wm} min</b> training a day. Protein: about <b>${Math.round(p.wt*({lose:1.8,fit:1.4,gain:1.8}[p.goal]))} g</b> a day.</p><button class='btn' style='width:100%' onclick='applyT()'>Use these goals</button>`:'<p class="sub" style="margin:6px 0 0">Fill every field to see your suggested goals.</p>'}<button class='btn alt' style='width:100%;margin-top:10px' onclick='obOpen()'>Redo guided setup</button><p class='sub' style='font-size:12px;margin:10px 0 0'>These are estimates, not medical advice. If you are pregnant, under 18 or have a health condition, ask a doctor first.</p>`)}

function vYou(){const h=vYou0(),m='<div class="card"><h3>Daily goals</h3>',i=h.indexOf(m),T=card('Trends',`<p class='sub' style='margin:0 0 10px;font-size:13px'>Your weekly summary in plain words, plus the charts.</p><button class='btn' style='width:100%' onclick='go("Trends")'>Open trends</button>`);return i<0?h+profCard():h.slice(0,i)+profCard()+h.slice(i)}
