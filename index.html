<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oracle Fitness</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oracle Fitness">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='12' fill='%231fb76a'/><path d='M6 24c5-8 11-12 18-12s13 4 18 12c-5 8-11 12-18 12S11 32 6 24z' fill='none' stroke='white' stroke-width='3'/><circle cx='24' cy='24' r='8' fill='white'/></svg>">
<style>
:root{--bg:#f3f3f1;--card:#fff;--ink:#111;--sub:#6b6b70;--line:rgba(0,0,0,.08);--red:#e5484d;--grn:#1f9d5c;--blue:#1d7fe0;--org:#d9922b;--lime:#e5484d;--bar:rgba(255,255,255,.85);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#111214;--ink:#f5f5f5;--sub:#8c8c91;--line:rgba(255,255,255,.1);--red:#ff5d73;--grn:#4ee08f;--blue:#4aa8ff;--org:#ffc247;--lime:#ff5d73;--bar:rgba(28,28,30,.8)}}
:root[data-theme="dark"]{--bg:#000;--card:#111214;--ink:#f5f5f5;--sub:#8c8c91;--line:rgba(255,255,255,.1);--red:#ff5d73;--grn:#4ee08f;--blue:#4aa8ff;--org:#ffc247;--lime:#ff5d73;--bar:rgba(28,28,30,.8)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,"SF Pro Display",system-ui,sans-serif;padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:8px 16px}
h1{font-size:34px;font-weight:800;margin:8px 0 0;letter-spacing:-.5px}
h3{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.sub{color:var(--sub);margin:2px 0 8px;font-size:15px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0}
.in{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.rw{position:relative;width:170px;flex:none}
.rings{width:100%;display:block}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid b{font-size:34px;line-height:1}.mid span{font-size:11px;color:var(--sub)}
.st small{color:var(--sub);display:block;font-size:12px;margin-top:6px}
.st div{font-size:24px;font-weight:700}
u{text-decoration:none;font-size:13px;color:var(--sub);font-weight:600}
button{font-family:inherit;cursor:pointer;transition:transform .12s,opacity .2s}
button:active{transform:scale(.94)}
.btn{border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;color:#000;background:var(--blue)}
.btn.alt{background:var(--line);color:var(--ink);width:56px}
.btn.grn{background:var(--grn)}.btn.red{background:var(--red);color:#fff}
input,textarea{width:100%;background:var(--line);border:0;border-radius:12px;padding:13px;font:inherit;color:var(--ink);margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chips button{background:var(--line);color:var(--ink);border:0;border-radius:99px;padding:8px 14px;white-space:nowrap;font-size:14px}
.chips button.on{background:var(--blue);color:#000}
.pb{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin:4px 0 8px}
.pb i{display:block;height:100%;border-radius:9px;transition:width .6s}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.x{background:none;border:0;color:var(--red);font-size:22px;padding:0 4px}
.q{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.q:first-of-type{border:0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--sub);display:flex;align-items:center;justify-content:center;font-size:14px;color:#000;flex:none;transition:.25s}
.ck.on{background:var(--grn);border-color:var(--grn);transform:scale(1.1)}
.q small{margin-left:auto;color:var(--sub)}
.moods{display:flex;gap:8px}
.moods button{flex:1;font-size:28px;padding:10px 0;border:0;border-radius:14px;background:var(--line)}
.moods button.on{background:var(--org);transform:scale(1.08)}
.big{font-size:34px;font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 span{font-size:12px;color:var(--sub)}
.tab{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-top:1px solid var(--line);z-index:4}
.tab button{flex:1;background:none;border:0;color:var(--sub);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab button.on{color:var(--blue)}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);z-index:9;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
.dn{flex:1;text-align:center}.dn .rw{width:84px;height:84px;margin:0 auto 6px}.dn .rw svg{width:100%;height:100%;display:block}.dn b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px}.dn small{display:block;color:var(--sub);font-size:12px}
.lv{width:52px;height:52px;border-radius:50%;border:2px solid var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:var(--blue);flex:none}
.mini{width:46px;height:46px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 55%,hsl(var(--h) 80% 92%),hsl(var(--h) 65% 64%) 60%,hsl(var(--h) 40% 42%));box-shadow:0 0 18px hsl(var(--h) 80% 60%/.4)}
#ov{position:fixed;inset:0;z-index:8;background:radial-gradient(circle at 50% 45%,hsl(var(--h) 14% 36%),#1f2426 75%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));transition:background .4s}
#ov.in{animation:up .3s ease both}
.ot{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:18px}
.cb{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px;line-height:1}
#ov h2{font-size:28px;text-align:center;margin:26px 0 0;font-weight:700;color:rgba(255,255,255,.9)}
.mid2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.orb{width:270px;height:270px;position:relative}
.orb i{position:absolute;border-radius:50%}
.orb .o1{inset:0;border:1.5px solid rgba(255,255,255,.75);background:radial-gradient(circle,hsl(var(--h) 18% 58%/.5),hsl(var(--h) 14% 55%/.3));animation:blob 9s ease-in-out infinite}
.orb .o2{inset:30px;border:1.5px solid rgba(255,255,255,.7);background:radial-gradient(circle at 50% 62%,hsl(var(--h) 60% 86%/.9),hsl(var(--h) 30% 60%/.4));scale:var(--k,1);transition:scale .2s;animation:blob 7s ease-in-out infinite reverse}
.orb .o3{inset:72px;background:radial-gradient(circle at 50% 55%,hsl(var(--h) 90% 97%),hsl(var(--h) 70% 74%) 55%,hsl(var(--h) 60% 62%/.85));box-shadow:0 0 50px hsl(var(--h) 80% 60%/.55);scale:var(--k,1);transition:scale .2s}
.orb .o4{left:50%;top:50%;width:14px;height:14px;margin:-7px;background:hsl(var(--h) 40% 72%);border:1px solid rgba(255,255,255,.6)}
@keyframes blob{0%,100%{border-radius:50%;transform:rotate(0)}33%{border-radius:47% 53% 46% 54%/54% 46% 53% 47%}66%{border-radius:53% 47% 54% 46%/46% 54% 47% 53%;transform:rotate(25deg)}}
.ml{font-size:34px;font-weight:700;margin-top:34px;text-align:center}
input.sl{-webkit-appearance:none;appearance:none;height:58px;padding:0 4px;margin:0;border-radius:99px;background:rgba(255,255,255,.14)}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.sl::-moz-range-thumb{width:50px;height:50px;border:0;border-radius:50%;background:#fff}
.ends{display:flex;justify-content:space-between;width:100%;font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.55);margin:8px 6px 16px;text-transform:uppercase}
.nx{width:100%;max-width:340px;padding:16px;border:0;border-radius:99px;background:hsl(var(--h) 42% 52%);color:#fff;font-size:18px;font-weight:700}
.tg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.tg button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:10px 16px;font-size:15px}.tg button.on{background:#fff;color:#222}
.tab{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--line);border-radius:34px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.tab button{border-radius:28px;padding:8px 0}.tab button.on{background:var(--line);color:var(--grn)}
body{padding-bottom:120px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:6px 0}.hd b{font-size:17px}.hd span,.hd button{width:44px;height:44px}
.hd button{border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
.st u{text-transform:uppercase}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.gr .card{margin:0;min-width:0}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.gh h3{color:var(--ink);font-size:18px;font-weight:700;margin:0}
.chv{width:28px;height:28px;border-radius:50%;border:0;background:var(--line);color:var(--sub);font-size:18px;line-height:1;padding:0}
.gc .big{font-size:30px}.gc u{text-transform:uppercase}
.ic{width:46px;height:46px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--blue);margin-bottom:8px}.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ed{width:100%;padding:16px;border:0;border-radius:99px;background:color-mix(in srgb,var(--grn) 18%,transparent);color:var(--grn);font-size:17px;font-weight:700}
body{background:radial-gradient(120% 55% at 50% -8%,color-mix(in srgb,var(--grn) 24%,transparent),transparent 62%),var(--bg);background-attachment:fixed}
body::before,body::after{content:"";position:fixed;border-radius:50%;background:var(--grn);filter:blur(80px);opacity:.13;pointer-events:none;z-index:0}
body::before{width:260px;height:260px;right:-90px;top:260px}body::after{width:300px;height:300px;left:-120px;bottom:90px}
.wrap{position:relative;z-index:1}
.card{background:linear-gradient(160deg,color-mix(in srgb,var(--grn) 9%,var(--card)),var(--card));border:1px solid var(--line);box-shadow:0 12px 30px -20px rgba(0,0,0,.7)}
.btn{background:linear-gradient(135deg,var(--lime),var(--grn));color:#04210f}
.tab{background:color-mix(in srgb,var(--card) 82%,transparent)}
.tab button.on{background:color-mix(in srgb,var(--grn) 20%,transparent);color:var(--grn)}
.hd .lg{width:40px;height:40px;display:block}
.wm{text-align:center;line-height:1.15}.wm b{display:block;font-size:16px;letter-spacing:.3em;margin-right:-.3em}.wm i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.55em;margin-right:-.55em;color:var(--grn)}
#sp{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,#0f3a27,#06120d 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .5s}
#sp.out{opacity:0}#sp .lg{width:96px;height:96px;margin-bottom:16px;animation:pulse 1.4s ease-in-out infinite}
#sp b{font-size:30px;letter-spacing:.32em;margin-right:-.32em}#sp i{font-style:normal;color:#4ee08f;letter-spacing:.5em;margin:6px -.5em 0 0;font-size:13px}
@keyframes pulse{50%{transform:scale(1.07)}}
body{background:var(--bg)}body::before,body::after{display:none}
.card{background:var(--card);border:1px solid var(--line);box-shadow:none}
.btn{background:var(--blue);color:#021a33}
.tab{background:color-mix(in srgb,var(--card) 85%,transparent)}
.tab button.on{background:var(--line);color:var(--grn)}
#sp{background:#000}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tab" id="tab"></nav>
<div id="toast"></div>
<script>
const K='vq2',$=s=>document.querySelector(s),MO=['😞','😕','😐','🙂','😄'];
let S,V='Today',NEW=1;
const dk=o=>{const d=new Date();d.setDate(d.getDate()+(o||0));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fresh=d=>({day:d,foods:[],water:0,workouts:[],mood:null,sleep:0,paid:{},hd:{}});
function load(){const s={hp:50,xp:0,gold:0,lvl:1,goal:{cal:2000,water:8,sleep:7,wm:30},t:fresh(dk()),hist:{},wt:[],hab:[],fav:[],theme:'dark'};
try{const r=localStorage.getItem(K)||localStorage.getItem('vitaquest1');if(r){const o=JSON.parse(r);for(const k in o)s[k]=o[k];s.goal=Object.assign({wm:30},s.goal);s.t.hd=s.t.hd||{};if(s.v!==3){s.v=3;s.t.mood=null;for(const k in s.hist)s.hist[k].md=null}}}catch(e){}return s}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=()=>S.t.workouts.reduce((a,b)=>a+b.m,0);
const net=()=>S.t.foods.reduce((a,b)=>a+b.k,0)-S.t.workouts.reduce((a,b)=>a+(b.b||0),0);
function Qs(){const g=S.goal,t=S.t,a=[['water','Hydrate',t.water>=g.water,t.water+'/'+g.water],['workout','Train',tm()>=g.wm,tm()+'/'+g.wm+' min'],['food','Log food',t.foods.length>0,t.foods.length+' items'],['mood','Log mood',t.mood!==null,''],['sleep','Sleep',t.sleep>=g.sleep,t.sleep+'/'+g.sleep+' h']];
S.hab.forEach(h=>a.push(['h'+h.id,h.n,!!t.hd[h.id],'',h.id]));return a}
function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2000)}
function gain(xp,g,h){S.xp+=xp;S.gold+=g;S.hp=Math.min(100,S.hp+h);while(S.xp>=S.lvl*100){S.xp-=S.lvl*100;S.lvl++;toast('Level up! Level '+S.lvl)}}
function award(){Qs().forEach(q=>{if(q[2]&&!S.t.paid[q[0]]){S.t.paid[q[0]]=1;gain(15,5,4);toast('Done: '+q[1]+' +15 XP')}})}
function roll(){const d=dk();if(S.t.day===d)return;const q=Qs(),n=q.filter(x=>x[2]).length;
S.hist[S.t.day]={c:net(),w:S.t.water,m:tm(),md:S.t.mood,s:S.t.sleep,q:n,n:q.length};
const miss=q.length-n;S.hp=Math.max(0,S.hp-miss*8);
if(S.hp===0){S.lvl=Math.max(1,S.lvl-1);S.hp=50;S.xp=0;setTimeout(()=>toast('You fainted. Lost a level, HP restored'),600)}
else if(miss)setTimeout(()=>toast('Missed '+miss+' quests yesterday'),600);
S.t=fresh(d)}
function streak(){const q=Qs();let c=q.filter(x=>x[2]).length/q.length>=.8?1:0;for(let i=1;i<400;i++){const h=S.hist[dk(-i)];if(!h||h.q/h.n<.8)break;c++}return c}
const commit=()=>{award();save();render()};
const R=[88,66,44];
function rings(p,cols){return '<svg viewBox="0 0 200 200" class="rings">'+R.map((r,i)=>{const C=2*Math.PI*r;return `<circle cx="100" cy="100" r="${r}" fill="none" stroke-width="18" style="stroke:${cols[i]};stroke-opacity:.22"/><circle class="rg" data-c="${C}" data-p="${Math.min(1,p[i])}" cx="100" cy="100" r="${r}" fill="none" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 100 100)" style="stroke:${cols[i]};transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/>`}).join('')+'</svg>'}
const lbl=k=>new Date(k+'T12:00').toLocaleDateString('en',{weekday:'narrow'});
function week(){const a=[];for(let i=6;i>=0;i--){const k=dk(-i);a.push({k,h:i?(S.hist[k]||{}):{c:net(),w:S.t.water,m:tm(),md:S.t.mood,s:S.t.sleep}})}return a}
function bars(f,col,goal){const w=week(),v=w.map(x=>f(x.h)||0),mx=Math.max(goal||1,...v,1);
let s='<svg viewBox="0 0 280 120" width="100%">';
v.forEach((n,i)=>{const h=n/mx*80;s+=`<rect x="${i*40+6}" y="${90-h}" width="28" height="${Math.max(h,3)}" rx="8" style="fill:${col};opacity:${i==6?1:.55}"/><text x="${i*40+20}" y="110" text-anchor="middle" font-size="11" style="fill:var(--sub)">${lbl(w[i].k)}</text>`});
if(goal)s+=`<line x1="0" x2="280" y1="${90-goal/mx*80}" y2="${90-goal/mx*80}" stroke-dasharray="3 4" style="stroke:var(--sub)"/>`;
return s+'</svg>'}
function wline(){const a=S.wt.slice(-14);if(a.length<2)return '<p class="sub">Log two weigh-ins to see your line.</p>';
const ws=a.map(x=>x.w),lo=Math.min(...ws),r=(Math.max(...ws)-lo)||1,p=a.map((x,i)=>[10+i*260/(a.length-1),85-(x.w-lo)/r*65]);
return `<svg viewBox="0 0 280 100" width="100%"><polyline points="${p.map(q=>q.join(',')).join(' ')}" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--blue)"/>${p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" style="fill:var(--blue)"/>`).join('')}</svg>`}
const card=(t,b)=>`<div class="card">${t?`<h3>${t}</h3>`:''}${b}</div>`;
function vToday(){const n=net(),g=S.goal,over=n>g.cal,fc=over?'var(--org)':'var(--grn)',Q=Qs();
const av=S.hp<=20?'😵':S.lvl<3?'🐣':S.lvl<6?'🧒':'🦸';
return `<h1>Summary</h1><p class="sub">${new Date().toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'})}</p>
<div class="card"><div class="row"><div class="rw">${rings([tm()/g.wm,Math.max(0,n)/g.cal,S.t.water/g.water],['var(--red)',fc,'var(--blue)'])}<div class="mid"><b>${streak()}</b><span>day streak</span></div></div>
<div class="grow st"><small>Train</small><div style="color:var(--red)">${tm()}<u> /${g.wm} min</u></div><small>Fuel</small><div style="color:${fc}">${n}<u> /${g.cal} kcal</u></div><small>Hydrate</small><div style="color:var(--blue)">${S.t.water}<u> /${g.water} glasses</u></div></div></div>
<div class="row" style="margin-top:14px"><button class="btn alt" onclick="wat(-1)">−</button><button class="btn grow" onclick="wat(1)">💧 Add a glass</button></div></div>
${card('Daily quests',Q.map(q=>`<div class="q" ${q[4]?`onclick="hab(${q[4]})" style="cursor:pointer"`:''}><div class="ck${q[2]?' on':''}">${q[2]?'✓':''}</div><span>${esc(q[1])}</span><small>${q[3]}</small></div>`).join('')+'<p class="sub" style="margin:10px 0 0;font-size:12px">Missed quests cost 8 HP at midnight. A day with 80% done keeps your streak.</p>')}
${card('Mood',`<div class="moods">${MO.map((e,i)=>`<button class="${S.t.mood===i?'on':''}" onclick="md(${i})">${e}</button>`).join('')}</div>`)}
${card('Sleep',`<div class="row"><button class="btn alt" onclick="sl(-1)">−</button><div class="grow big" style="text-align:center">${S.t.sleep}<u> hours</u></div><button class="btn alt" onclick="sl(1)">＋</button></div>`)}
${card('Your hero',`<div class="row"><div style="font-size:48px">${av}</div><div class="grow"><b>Level ${S.lvl}</b><div class="pb"><i style="width:${S.hp}%;background:var(--red)"></i></div><small class="sub">Health ${S.hp}/100</small><div class="pb"><i style="width:${S.xp/(S.lvl*100)*100}%;background:var(--org)"></i></div><small class="sub">XP ${S.xp}/${S.lvl*100}</small></div></div>`)}`}

${card('Add or reduce',(S.fav.length?`<div class="chips">${S.fav.map((f,i)=>`<button onclick="fav(${i})">${esc(f.n)} · ~${f.k}</button>`).join('')}</div>`:'')+`<p class="sub" style="font-size:13px;margin:0 0 6px">Rough portion guides. Tap one, then adjust.</p><div class="chips">${[['Drink',120],['Snack',150],['Small meal',400],['Normal meal',650],['Large meal',900]].map(p=>`<button onclick="pz('${p[0]}',${p[1]})">${p[0]} ~${p[1]}</button>`).join('')}</div><input id="fn" placeholder="What was it? (optional)"><input id="fk" type="number" inputmode="numeric" placeholder="Estimated calories"><div class="row"><button class="btn grn grow" onclick="addF(1)">＋ Add</button><button class="btn red grow" onclick="addF(-1)">− Reduce</button></div>`)}
<p class="sub" style="padding:0 6px;font-size:13px">Nobody can know the exact calories in a meal. Portion size, oil, brand and cooking all change the number. Keep your guesses consistent and watch the weekly trend instead of any single entry.</p>
${card('Today',S.t.foods.length?S.t.foods.map((f,i)=>`<div class="item"><span>${esc(f.n)}</span><span>${f.k>0?'~+':'~'}${f.k} <button class="x" onclick="delF(${i})">×</button></span></div>`).join(''):'<p class="sub">Nothing logged yet.</p>')}`}
function render(){document.documentElement.dataset.theme=S.theme==='auto'?'':S.theme;
$('#app').innerHTML=`<div class="${NEW?'in':''}">${({Today:vToday,Food:vFood,Train:vTrain,Weight:vWeight,Trends:vTrends,You:vYou})[V]()}</div>`;NEW=0;
$('#tab').innerHTML=['Today','Food','Train','Weight','Trends'].map(t=>`<button class="${V===t?'on':''}" onclick="go('${t}')"><svg viewBox="0 0 24 24">${IC[t]}</svg>${t==='Today'?'Summary':t}</button>`).join('');
requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.rg').forEach(e=>e.style.strokeDashoffset=e.dataset.c*(1-e.dataset.p))))}
const LOGO='<svg class="lg" viewBox="0 0 48 48"><defs><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4f04a"/><stop offset="1" stop-color="#1fb76a"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#lgg)"/><path d="M6 24c5-8 11-12 18-12s13 4 18 12c-5 8-11 12-18 12S11 32 6 24z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/><circle cx="24" cy="24" r="8.5" fill="#fff"/><path d="M24 17c4 3 5 7 0 14-5-7-4-11 0-14z" fill="#0b6b3a"/></svg>';
(function(){const s=document.createElement('div');s.id='sp';s.innerHTML=LOGO+'<b>ORACLE</b><i>FITNESS</i>';document.body.appendChild(s);setTimeout(()=>s.classList.add('out'),1000);setTimeout(()=>s.remove(),1550)})();
S=load();roll();award();save();render();
</script>
